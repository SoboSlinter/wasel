<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Wasel</title>
  <link rel="icon" href="img/logo-mark.png" type="image/png">
  <meta name="theme-color" content="#1f6360">
  <link rel="preload" href="css/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/i18n-es.js"></script>
  <script src="js/i18n.js"></script>
<script>document.documentElement.classList.add("has-shell");try{var t=localStorage.getItem("wasel-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <div id="site-header"></div>
  <main class="auth-box">
    <h1 style="font-size:1.5rem">Reset your password</h1>
    <p class="muted" style="margin-top:8px">Enter your email and we'll send you a link to choose a new password.</p>
    <div id="auth-msg" hidden style="margin-top:16px"></div>
    <form id="auth-form" data-mode="forgot" style="margin-top:24px">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <button class="btn btn-block" type="submit">Send reset link</button>
    </form>
    <p class="muted small" style="margin-top:24px"><a class="link" href="login.html" data-back-login>Back to log in</a></p>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="js/recover.js"></script>
</body>
</html>

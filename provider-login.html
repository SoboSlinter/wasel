<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider log in — Wasel</title>
  <link rel="icon" href="img/logo-mark.png" type="image/png">
  <meta name="theme-color" content="#1f6360">
  <link rel="preload" href="css/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/i18n-es.js"></script>
  <script src="js/i18n.js"></script>
<script>document.documentElement.classList.add("has-shell");try{var t=localStorage.getItem("wasel-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <div id="site-header"></div>
  <main class="auth-box">
    <div class="eyebrow">For service providers</div>
    <h1 style="font-size:1.5rem;margin-top:4px">Provider log in</h1>
    <div id="auth-notice" hidden style="margin-top:16px"></div>
    <form id="auth-form" data-mode="login" data-portal="provider" data-login-page="provider-login.html" style="margin-top:24px">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" required minlength="8" autocomplete="current-password"><button type="button" class="pw-toggle" data-toggle-pw="password" aria-pressed="false">Show</button></div></div>
      <div class="auth-row"><a class="link small" href="forgot.html?portal=provider" data-keep-next>Forgot password?</a></div>
      <div id="auth-msg" hidden></div>
      <div id="auth-extra" style="margin-top:12px"></div>
      <button class="btn btn-block" type="submit" style="margin-top:16px">Log in</button>
    </form>
    <p class="muted small" style="margin-top:24px">New provider? <a class="link" href="provider-signup.html" id="alt-link" data-keep-next>Create a provider account</a></p>
    <p class="muted small" style="margin-top:12px">Looking to book a service? <a class="link" href="login.html">Customer log in</a></p>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>

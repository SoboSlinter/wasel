<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer sign up — Wasel</title>
  <link rel="icon" href="img/logo-mark.png" type="image/png">
  <meta name="theme-color" content="#1f6360">
  <link rel="preload" href="css/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/supabase.js"></script>
  <script src="js/i18n-es.js"></script>
  <script src="js/i18n.js"></script>
<script>document.documentElement.classList.add("has-shell");try{var t=localStorage.getItem("wasel-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <div id="site-header"></div>
  <main class="auth-box">
    <div class="eyebrow">For customers</div>
    <h1 style="font-size:1.5rem;margin-top:4px">Create your account</h1>
    <form id="auth-form" data-mode="signup" data-portal="customer" data-login-page="login.html" style="margin-top:24px">
      <div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" required autocomplete="name"></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"><button type="button" class="pw-toggle" data-toggle-pw="password" aria-pressed="false">Show</button></div><div class="hint">At least 8 characters.</div></div>
      <div class="field"><label for="password2">Confirm password</label><div class="pw"><input id="password2" name="password2" type="password" required minlength="8" autocomplete="new-password"><button type="button" class="pw-toggle" data-toggle-pw="password2" aria-pressed="false">Show</button></div></div>
      <div id="auth-msg" hidden></div>
      <div id="auth-extra" style="margin-top:12px"></div>
      <button class="btn btn-block" type="submit" style="margin-top:16px">Sign up</button>
    </form>
    <p class="muted small" style="margin-top:12px">By creating an account you agree to the <a class="link" href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a class="link" href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>
    <p class="muted small" style="margin-top:24px">Already have an account? <a class="link" href="login.html" id="alt-link" data-keep-next>Log in</a></p>
    <p class="muted small" style="margin-top:12px">Want to offer services? <a class="link" href="provider-signup.html">Create a provider account</a></p>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
